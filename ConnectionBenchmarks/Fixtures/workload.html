<!doctype html><html><head><meta charset="utf-8"><title>Harbor connection benchmark</title></head><body><h1>Local connection benchmark</h1><div id="rows"></div><script>
window.memory=new Uint8Array(8*1024*1024);
for(let i=0;i<memory.length;i+=4096)memory[i]=i%251;
window.benchmarkTicks=0;
window.benchmarkWork=()=>{const end=performance.now()+8;let value=0;while(performance.now()<end)value+=Math.sqrt(value+1);benchmarkTicks++;memory[(benchmarkTicks*4096)%memory.length]=benchmarkTicks%251;return benchmarkTicks;};
for(let i=0;i<300;i++){let row=document.createElement('p');row.textContent='Local test row '+i;document.getElementById('rows').append(row);}
</script></body></html>
