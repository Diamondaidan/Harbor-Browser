<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#071522}video{display:block;width:100%;height:100%;object-fit:contain}</style></head><body><canvas hidden id="canvas" width="640" height="360"></canvas><video id="video" autoplay muted playsinline></video><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),video=document.getElementById('video');let tick=0;function draw(){ctx.fillStyle='#16364b';ctx.fillRect(0,0,640,360);ctx.fillStyle='#eeb273';ctx.fillRect((tick++*3)%590,130,50,50);ctx.fillStyle='#fff';ctx.font='28px sans-serif';ctx.fillText('Harbor live video test',35,65);ctx.font='18px sans-serif';ctx.fillText('Frame '+tick,35,315)}draw();setInterval(draw,100);video.srcObject=canvas.captureStream(10);video.play();</script></body></html>
